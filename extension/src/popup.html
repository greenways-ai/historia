<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historia Collect</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { width: 300px; margin: 0; padding: 18px; background: #0b1513; color: #fff9e9; }
    h1 { margin: 0 0 6px; font: 400 24px Georgia, serif; }
    p { margin: 0 0 16px; color: #b4ad99; font-size: 13px; line-height: 1.45; }
    button { width: 100%; min-height: 44px; border: 0; background: #5079b4; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 38px; margin-top: 12px; color: #aec7e8; font: 12px ui-monospace, monospace; white-space: pre-wrap; }
    a { color: #e0b56f; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Historia Collect</h1>
  <p>Archive the conversation currently rendered in ChatGPT. Nothing is sent to a remote service.</p>
  <button id="capture" type="button">Collect this conversation</button>
  <div id="status" role="status" aria-live="polite"></div>
  <a href="#" id="options">Collection settings</a>
  <script type="module" src="popup.js"></script>
</body>
</html>
