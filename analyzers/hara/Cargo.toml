[package]
name = "historia-hara-analyzer"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
build = "build.rs"
license = "Apache-2.0"

[[bin]]
name = "historia-hara-analyzer"
path = "src/main.rs"

[dependencies]
hara-wasm = { git = "https://github.com/hara-lang/hara", rev = "79a289f36ec6528426da88cb9bcc80c504bfd9eb", default-features = false, features = ["whole-wasm"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
hara-wasm = { git = "https://github.com/hara-lang/hara", rev = "79a289f36ec6528426da88cb9bcc80c504bfd9eb", default-features = false, features = ["whole-wasm"] }
