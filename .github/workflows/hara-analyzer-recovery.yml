name: Hara analyzer recovery

on:
  workflow_run:
    workflows:
      - Hara analyzer
    types:
      - completed

permissions:
  contents: read

jobs:
  verify-current-main:
    if: github.event.workflow_run.id == 31120940511 || github.event.workflow_run.id == 31125425894
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.12.218

      - name: Install Historia dependencies
        run: bun install --frozen-lockfile

      - name: Build and test the .hal analyzer on hara-rust-full
        run: |
          cargo test --manifest-path analyzers/hara/Cargo.toml
          cargo build --release --manifest-path analyzers/hara/Cargo.toml

      - name: Check Historia analyzer protocol conformance
        run: bun run conformance:hara

      - name: Smoke-test exact parity on the fixed fixtures
        run: |
          bun benchmarks/clojure-analyzers.js \
            --parity-only \
            --files 0 \
            --definitions 0

      - name: Require identical Babashka and Hara outputs
        run: bun run analyzer:parity

      - name: Benchmark controlled corpus shapes
        run: |
          bun benchmarks/clojure-analyzer-matrix.js \
            --warmup 2 \
            --iterations 8 \
            --cold-runs 5 \
            --output-dir target/clojure-analyzer-recovery

      - name: Add results to the job summary
        if: always()
        run: |
          if [ -f target/clojure-analyzer-recovery/summary.md ]; then
            cat target/clojure-analyzer-recovery/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hara-analyzer-recovery-${{ github.run_id }}
          path: |
            target/clojure-analyzer-recovery
            target/clojure-analyzer-benchmark
          if-no-files-found: ignore
