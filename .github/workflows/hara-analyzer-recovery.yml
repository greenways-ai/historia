name: Hara analyzer recovery

on:
  issue_comment:
    types:
      - created
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-pr61:
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 61 && startsWith(github.event.comment.body, '/run-hara-benchmark'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hara-semantic-shapes

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.12.218

      - name: Install Historia dependencies
        run: bun install --frozen-lockfile

      - name: Build and test the .hal analyzer on hara-rust-full
        run: |
          cargo test --manifest-path analyzers/hara/Cargo.toml
          cargo build --release --manifest-path analyzers/hara/Cargo.toml

      - name: Check Historia analyzer protocol conformance
        run: bun run conformance:hara

      - name: Smoke-test analyzer response shapes
        run: bun run analyzer:shape

      - name: Benchmark controlled corpus shapes
        run: |
          bun benchmarks/clojure-analyzer-matrix.js \
            --warmup 2 \
            --iterations 8 \
            --cold-runs 5 \
            --output-dir target/clojure-analyzer-pr61

      - name: Add results to the job summary
        if: always()
        run: |
          if [ -f target/clojure-analyzer-pr61/summary.md ]; then
            cat target/clojure-analyzer-pr61/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hara-analyzer-pr61-${{ github.run_id }}
          path: target/clojure-analyzer-pr61
          if-no-files-found: ignore

      - name: Publish results on PR 61
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 61 --body-file target/clojure-analyzer-pr61/summary.md

      - name: Remove this one-shot recovery workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if [ ! -f .github/workflows/hara-analyzer-recovery.yml ]; then
            exit 0
          fi
          git rm .github/workflows/hara-analyzer-recovery.yml
          git commit -m "Remove one-shot Hara analyzer recovery workflow"
          git push origin main
