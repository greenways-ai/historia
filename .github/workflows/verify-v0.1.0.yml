name: Verify Historia v0.1.0 publication

on:
  push:
    branches:
      - main
    paths:
      - ".github/verify-v0.1.0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historia-verify-v0.1.0
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.1.0
  RELEASE_TAG: v0.1.0
  PACKAGE_SPEC: "@greenways-ai/historian@0.1.0"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Wait for the GitHub Release and npm package
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_status=missing
          npm_status=missing

          for attempt in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" --json tagName,name,isDraft,isPrerelease,publishedAt,url > /tmp/historia-release.json 2>/tmp/historia-release-error.txt; then
              release_status=published
              break
            fi
            echo "GitHub Release not available yet (attempt $attempt/60)"
            sleep 15
          done

          for attempt in $(seq 1 60); do
            if npm view "$PACKAGE_SPEC" version dist.integrity dist.tarball --json > /tmp/historia-npm.json 2>/tmp/historia-npm-error.txt; then
              published="$(node -e "const v=require('/tmp/historia-npm.json'); console.log(v.version ?? '')")"
              if [ "$published" = "$RELEASE_VERSION" ]; then
                npm_status=published
                break
              fi
            fi
            echo "npm package not available yet (attempt $attempt/60)"
            sleep 15
          done

          echo "release_status=$release_status" >> "$GITHUB_OUTPUT"
          echo "npm_status=$npm_status" >> "$GITHUB_OUTPUT"

      - name: Download and verify every GitHub Release asset
        id: assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ steps.publication.outputs.release_status }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/historia-release-assets
          checksum_status=not-run
          asset_status=not-run

          if [ "$RELEASE_STATUS" = published ]; then
            gh release download "$RELEASE_TAG" --dir /tmp/historia-release-assets

            expected=(
              SHA256SUMS
              release-manifest-v1.json
              historia-collect-extension-v0.1.0.zip
              historia-v0.1.0-linux-x64.tar.gz
              historia-v0.1.0-linux-arm64.tar.gz
              historia-v0.1.0-darwin-x64.tar.gz
              historia-v0.1.0-darwin-arm64.tar.gz
              historia-v0.1.0-windows-x64.zip
              historia-v0.1.0-windows-arm64.zip
            )

            missing=0
            for name in "${expected[@]}"; do
              if [ ! -f "/tmp/historia-release-assets/$name" ]; then
                echo "Missing expected release asset: $name" >&2
                missing=1
              fi
            done
            if [ "$missing" -eq 0 ]; then
              asset_status=complete
            else
              asset_status=incomplete
            fi

            if (
              cd /tmp/historia-release-assets
              sha256sum --check SHA256SUMS
            ); then
              checksum_status=verified
            else
              checksum_status=failed
            fi
          fi

          echo "asset_status=$asset_status" >> "$GITHUB_OUTPUT"
          echo "checksum_status=$checksum_status" >> "$GITHUB_OUTPUT"

      - name: Write machine-readable publication status
        if: always()
        env:
          RELEASE_STATUS: ${{ steps.publication.outputs.release_status }}
          NPM_STATUS: ${{ steps.publication.outputs.npm_status }}
          ASSET_STATUS: ${{ steps.assets.outputs.asset_status }}
          CHECKSUM_STATUS: ${{ steps.assets.outputs.checksum_status }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return None

          assets = []
          asset_root = Path('/tmp/historia-release-assets')
          if asset_root.exists():
              assets = sorted(
                  {
                      'name': path.name,
                      'byte_count': path.stat().st_size,
                  }
                  for path in asset_root.iterdir()
                  if path.is_file()
              , key=lambda item: item['name'])

          status = {
              '$schema': 'historia.release.publication-status/v1',
              'version': '0.1.0',
              'tag': 'v0.1.0',
              'source_sha': os.environ['SOURCE_SHA'],
              'github_release': {
                  'status': os.environ.get('RELEASE_STATUS', 'unknown'),
                  'metadata': load('/tmp/historia-release.json'),
                  'error': Path('/tmp/historia-release-error.txt').read_text().strip() if Path('/tmp/historia-release-error.txt').exists() else None,
                  'asset_status': os.environ.get('ASSET_STATUS', 'unknown'),
                  'checksum_status': os.environ.get('CHECKSUM_STATUS', 'unknown'),
                  'assets': assets,
              },
              'npm': {
                  'status': os.environ.get('NPM_STATUS', 'unknown'),
                  'metadata': load('/tmp/historia-npm.json'),
                  'error': Path('/tmp/historia-npm-error.txt').read_text().strip() if Path('/tmp/historia-npm-error.txt').exists() else None,
              },
          }
          Path('/tmp/release-status-v0.1.0.json').write_text(json.dumps(status, indent=2) + '\n')
          PY

          rm -rf /tmp/release-status-branch
          git clone --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" /tmp/release-status-branch
          cd /tmp/release-status-branch
          git switch --orphan release-status-v0.1.0
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/release-status-v0.1.0.json ./release-status-v0.1.0.json
          git add release-status-v0.1.0.json
          git config user.name "Historia Release Verifier"
          git config user.email "collect@historia.local"
          git commit -m "chore: record Historia v0.1.0 publication status"
          git push --force origin HEAD:refs/heads/release-status/v0.1.0

      - name: Enforce complete publication
        if: always()
        env:
          RELEASE_STATUS: ${{ steps.publication.outputs.release_status }}
          NPM_STATUS: ${{ steps.publication.outputs.npm_status }}
          ASSET_STATUS: ${{ steps.assets.outputs.asset_status }}
          CHECKSUM_STATUS: ${{ steps.assets.outputs.checksum_status }}
        run: |
          set -euo pipefail
          test "$RELEASE_STATUS" = published
          test "$NPM_STATUS" = published
          test "$ASSET_STATUS" = complete
          test "$CHECKSUM_STATUS" = verified
