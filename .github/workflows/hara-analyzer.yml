name: Hara analyzer

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  exact-output-and-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.12.218

      - name: Install Historia dependencies
        run: bun install --frozen-lockfile

      - name: Build and test the .hal analyzer on hara-rust-full
        run: |
          cargo test --manifest-path analyzers/hara/Cargo.toml
          cargo build --release --manifest-path analyzers/hara/Cargo.toml

      - name: Check Historia analyzer protocol conformance
        run: bun run conformance:hara

      - name: Require identical Babashka and Hara outputs
        run: bun run analyzer:parity

      - name: Benchmark only after exact parity
        run: |
          mkdir -p target
          bun benchmarks/clojure-analyzers.js \
            --warmup 2 \
            --iterations 8 \
            --cold-runs 5 \
            --json target/clojure-analyzer-benchmark.json \
            --markdown target/clojure-analyzer-benchmark.md

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: hara-analyzer-benchmark
          path: |
            target/clojure-analyzer-benchmark.json
            target/clojure-analyzer-benchmark.md

      - name: Publish benchmark on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- historia-hara-rust-full-benchmark -->'
          {
            echo "$marker"
            cat target/clojure-analyzer-benchmark.md
          } > target/pr-comment.md
          existing=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/$existing" \
              -f body="$(cat target/pr-comment.md)"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file target/pr-comment.md
          fi
