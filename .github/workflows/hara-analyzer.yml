name: Hara analyzer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  shape-and-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HARA_RUNTIME_REV: agent/whole-wasm-code-analyzer
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.12.218

      - name: Install Historia dependencies
        run: bun install --frozen-lockfile

      - name: Build the Hara-owned whole-Wasm analyzer runtime
        run: bun run hara:build

      - name: Smoke-test analyzer startup and first analysis
        shell: bash
        run: |
          mkdir -p target
          {
            printf '%s\n' '{"protocol_version":"1.0","request_id":"startup-describe","op":"describe"}'
            printf '%s\n' '{"protocol_version":"1.0","request_id":"startup-analyze","op":"analyze","language":"clojure","path":"smoke.clj","blob_oid":"smoke","source":"(ns smoke)\n(defn answer [x] (+ x 1))"}'
            printf '%s\n' '{"protocol_version":"1.0","request_id":"startup-shutdown","op":"shutdown"}'
          } | analyzers/hara/bin/historia-hara-analyzer \
            > >(tee target/hara-startup.stdout) \
            2> >(tee target/hara-startup.stderr >&2)
          grep -q '"request_id":"startup-describe"' target/hara-startup.stdout
          grep -q '"request_id":"startup-analyze"' target/hara-startup.stdout
          grep -q '"request_id":"startup-shutdown"' target/hara-startup.stdout

      - name: Check Historia analyzer protocol conformance
        run: bun run conformance:hara

      - name: Smoke-test analyzer response shapes
        run: bun run analyzer:shape

      - name: Benchmark controlled corpus shapes
        run: |
          bun benchmarks/clojure-analyzer-matrix.js \
            --warmup 2 \
            --iterations 8 \
            --cold-runs 5 \
            --output-dir target/clojure-analyzer-benchmarks

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hara-analyzer-scale-benchmark
          path: |
            target/clojure-analyzer-benchmarks
            target/hara-startup.stdout
            target/hara-startup.stderr
          if-no-files-found: ignore

      - name: Publish benchmark on the pull request
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- historia-hara-rust-full-benchmark -->'
          {
            echo "$marker"
            cat target/clojure-analyzer-benchmarks/summary.md
          } > target/pr-comment.md
          existing=$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/$existing" \
              -f body="$(cat target/pr-comment.md)"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body-file target/pr-comment.md
          fi
