name: Hara application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hara-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HARA_APPLICATION_REV: 4f4565b5e2ecf476c09f77642bfe29a83fd21972
      RUST_MIN_STACK: 8388608
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the Hara application runtimes
        run: sh bin/build-hara-app

      - name: Verify the immutable Hara application revision
        run: test "$(cat target/bin/hara-application-revision.txt)" = "$HARA_APPLICATION_REV"

      - name: Test the generic Hara application boundary
        run: |
          CARGO_TARGET_DIR=target/hara-build cargo test \
            --manifest-path target/hara-runtime/core/rust/Cargo.toml \
            --bin hara-app

      - name: Exercise the dependency-light Hara runtime
        run: |
          mkdir -p target/hara-application
          test "$(target/bin/hara-lite --version)" = 'hara lite 0.1.6'
          test "$(target/bin/hara-lite --project "$GITHUB_WORKSPACE/packages/core" eval '(+ 19 23)')" = '42'
          target/bin/hara-lite --project "$GITHUB_WORKSPACE/packages/core" eval \
            '(do (require [historia.core.provider :as provider]) (provider/counts (provider/create-registry)))' \
            | tee target/hara-application/lite-core.edn
          grep -q '"providers" 0' target/hara-application/lite-core.edn
          target/bin/hara-lite --project "$GITHUB_WORKSPACE" eval \
            '(do (require [historia.kernel :as kernel]) (get kernel/descriptor "schema"))' \
            | tee target/hara-application/lite-application.edn
          grep -q 'historia.core/0-alpha' target/hara-application/lite-application.edn

      - name: Run focused provider Work tests through native hara-test
        run: |
          work_project="$GITHUB_WORKSPACE/target/provider-work-project"
          rm -rf "$work_project"
          mkdir -p "$work_project/src"
          cp -R target/hara-runtime/core/lib/src/. "$work_project/src/"
          cp -R packages/core/src/. "$work_project/src/"
          cp -R src-hara/. "$work_project/src/"
          cat > "$work_project/project.edn" <<'EOF'
          {:hara/type :project
           :hara/version "1.0.0"
           :project/id greenways/historia-provider-work-test
           :project/version "0.1.0"
           :project/source-paths ["src"]
           :project/test-paths []
           :project/extension-paths []
           :project/capabilities #{:file :process}
           :project/dependencies {}}
          EOF

          CARGO_TARGET_DIR=target/hara-build cargo run --quiet \
            --manifest-path target/hara-runtime/core/rust/Cargo.toml \
            --bin hara-test -- \
            --root "$work_project" \
            "$GITHUB_WORKSPACE/test-hara/historia/provider_broker_test.hal"

          CARGO_TARGET_DIR=target/hara-build cargo run --quiet \
            --manifest-path target/hara-runtime/core/rust/Cargo.toml \
            --bin hara-test -- \
            --root "$work_project" \
            "$GITHUB_WORKSPACE/test-hara/historia/source_archive_test.hal"

      - name: Check and test the capability-free core package
        run: |
          target/bin/hara --project "$GITHUB_WORKSPACE/packages/core" check
          target/bin/hara --project "$GITHUB_WORKSPACE/packages/core" test

      - name: Prove a capability-free source consumer
        run: |
          scripts/materialize-historia-core-consumer
          target/bin/hara --project "$GITHUB_WORKSPACE/examples/historia-core-consumer" check
          target/bin/hara --project "$GITHUB_WORKSPACE/examples/historia-core-consumer" test

      - name: Check and test the Historia application project
        run: |
          target/bin/hara --project "$GITHUB_WORKSPACE" check
          target/bin/hara --project "$GITHUB_WORKSPACE" test

      - name: Verify all built-in analyser assets
        run: scripts/check-analyzer-assets

      - name: Exercise help and version without Bun
        run: |
          mkdir -p target/hara-application
          bin/historia --help | tee target/hara-application/help.txt
          bin/historia --version | tee target/hara-application/version.txt
          grep -q 'Historia 0.1.0' target/hara-application/help.txt
          grep -q 'historia repl' target/hara-application/help.txt
          grep -q '^0.1.0$' target/hara-application/version.txt

      - name: Exercise the native Historia REPL without Bun
        run: |
          test ! -e target/historia-repl-source

          bin/historia repl --eval \
            '(do (require [historia.repl :as historia]) (historia/describe))' \
            | tee target/hara-application/repl-eval.edn
          grep -q 'historia.core/0-alpha' target/hara-application/repl-eval.edn

          printf '%s\n' \
            '(require [historia.repl :as historia])' \
            '(historia/describe)' \
            '/quit' \
            | bin/historia repl --no-splash --no-history \
            | tee target/hara-application/repl-plain.txt
          grep -q 'historia.core/0-alpha' target/hara-application/repl-plain.txt

          test ! -e target/historia-repl-source

      - name: Describe the minimal Hara core without Bun
        run: |
          bin/historia core describe | tee target/hara-application/core.edn
          grep -q 'historia.core/0-alpha' target/hara-application/core.edn
          grep -q 'javascript' target/hara-application/core.edn
          grep -q 'python' target/hara-application/core.edn
          grep -q 'clojure' target/hara-application/core.edn
          grep -q 'hara' target/hara-application/core.edn
          grep -q 'implementation' target/hara-application/core.edn
          grep -q 'memory' target/hara-application/core.edn

      - name: Initialize and verify a real Git vault without Bun
        run: |
          vault="$RUNNER_TEMP/historia-hara/vault.git"
          bin/historia vault init --vault "$vault" | tee target/hara-application/vault-init.edn
          bin/historia vault verify --vault "$vault" | tee target/hara-application/vault-verify.edn
          grep -q 'objectFormat' target/hara-application/vault-init.edn
          grep -q 'ok' target/hara-application/vault-verify.edn
          grep -q 'true' target/hara-application/vault-verify.edn
          test "$(git --git-dir "$vault" rev-parse --is-bare-repository)" = true

      - name: Upload Hara application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historia-hara-application
          path: target/hara-application
          if-no-files-found: ignore
