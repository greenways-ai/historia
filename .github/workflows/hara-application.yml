name: Hara application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hara-only-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARA_APPLICATION_REV: 52a015ecea0d8d5a2de35323095ae48b7a0eb594
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the Hara application runtime
        run: sh bin/build-hara-app

      - name: Test the generic Hara application boundary
        run: |
          CARGO_TARGET_DIR=target/hara-build cargo test \
            --manifest-path target/hara-runtime/core/rust/Cargo.toml \
            --bin hara-app

      - name: Check and test the capability-free core package
        run: |
          target/bin/hara --project packages/core check
          target/bin/hara --project packages/core test

      - name: Prove a project can select only historia-core
        run: |
          target/bin/hara --project examples/historia-core-consumer check
          target/bin/hara --project examples/historia-core-consumer test

      - name: Check and test the Historia application project
        run: |
          target/bin/hara --project . check
          target/bin/hara --project . test

      - name: Verify all built-in analyser assets
        run: scripts/check-analyzer-assets

      - name: Exercise help and version without Bun
        run: |
          mkdir -p target/hara-application
          bin/historia --help | tee target/hara-application/help.txt
          bin/historia --version | tee target/hara-application/version.txt
          grep -q 'Historia 0.1.0' target/hara-application/help.txt
          grep -q 'historia repl' target/hara-application/help.txt
          grep -q '^0.1.0$' target/hara-application/version.txt

      - name: Exercise the native Historia REPL without Bun
        run: |
          bin/historia repl --eval \
            '(do (require [historia.repl :as historia]) (historia/describe))' \
            | tee target/hara-application/repl-eval.edn
          grep -q 'historia.core/0-alpha' target/hara-application/repl-eval.edn

          printf '%s\n' \
            '(require [historia.repl :as historia])' \
            '(historia/describe)' \
            '/quit' \
            | bin/historia repl --no-splash --no-history \
            | tee target/hara-application/repl-plain.txt
          grep -q 'historia.core/0-alpha' target/hara-application/repl-plain.txt

      - name: Describe the minimal Hara core without Bun
        run: |
          bin/historia core describe | tee target/hara-application/core.edn
          grep -q 'historia.core/0-alpha' target/hara-application/core.edn
          grep -q 'javascript' target/hara-application/core.edn
          grep -q 'python' target/hara-application/core.edn
          grep -q 'clojure' target/hara-application/core.edn
          grep -q 'hara' target/hara-application/core.edn
          grep -q 'implementation' target/hara-application/core.edn
          grep -q 'memory' target/hara-application/core.edn

      - name: Initialize and verify a real Git vault without Bun
        run: |
          vault="$RUNNER_TEMP/historia-hara/vault.git"
          bin/historia vault init --vault "$vault" | tee target/hara-application/vault-init.edn
          bin/historia vault verify --vault "$vault" | tee target/hara-application/vault-verify.edn
          grep -q 'objectFormat' target/hara-application/vault-init.edn
          grep -q 'ok' target/hara-application/vault-verify.edn
          grep -q 'true' target/hara-application/vault-verify.edn
          test "$(git --git-dir "$vault" rev-parse --is-bare-repository)" = true

      - name: Upload Hara application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historia-hara-application
          path: target/hara-application
          if-no-files-found: ignore
