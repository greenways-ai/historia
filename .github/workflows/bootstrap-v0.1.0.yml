name: Bootstrap Historia v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-v0.1.0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historia-bootstrap-v0.1.0
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.1.0
  RELEASE_TAG: v0.1.0

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      tag_created: ${{ steps.release.outputs.tag_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - name: Verify version and create the release tag if absent
        id: release
        run: |
          set -euo pipefail
          package_version="$(bun -p "require('./package.json').version")"
          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "package.json version $package_version does not match bootstrap version $RELEASE_VERSION" >&2
            exit 1
          fi

          target_sha="$GITHUB_SHA"
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tag_sha" != "$target_sha" ]; then
              echo "Refusing to move existing $RELEASE_TAG from $tag_sha to $target_sha" >&2
              exit 1
            fi
            tag_created=false
          else
            git config user.name "Historia Release Bot"
            git config user.email "collect@historia.local"
            git tag -a "$RELEASE_TAG" "$target_sha" -m "Historia $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
            tag_created=true
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "tag_created=$tag_created" >> "$GITHUB_OUTPUT"

  github-release:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and verify all release assets
        run: bun run release:build -- --version "${{ needs.prepare.outputs.version }}"
      - name: Create or repair the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --title "Historia $TAG"
          else
            gh release create "$TAG" dist/release/* \
              --verify-tag \
              --generate-notes \
              --title "Historia $TAG"
          fi
          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,url

  npm-publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.12.218
          clj-kondo: 2026.05.25
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run release validation
        run: |
          bun run check
          bun run conformance
          npm pack --dry-run
      - name: Publish only when this exact version is absent
        env:
          NODE_AUTH_TOKEN: ""
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          package="@greenways-ai/historian@$VERSION"
          if npm view "$package" version --json >/tmp/historia-npm-version.json 2>/dev/null; then
            published="$(node -e "const value=require('/tmp/historia-npm-version.json'); console.log(Array.isArray(value) ? value.at(-1) : value)")"
            if [ "$published" = "$VERSION" ]; then
              echo "$package is already published; leaving the immutable registry version unchanged."
              exit 0
            fi
          fi
          npm publish --provenance --access public
