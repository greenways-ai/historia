name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.12.218
          clj-kondo: 2026.05.25
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run check
      - name: Build Historia executables
        run: |
          mkdir -p dist
          bun run build:historia-binary
          bun run build:collect-installer-binary
          bun run build:collect-host-binary
          ./dist/historia --version
          ./dist/historia-collect --version
      - run: bun run conformance

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
      - name: Build documentation portal
        run: npm run build
