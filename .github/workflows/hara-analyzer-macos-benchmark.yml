name: Hara analyzer macOS benchmark fallback

on:
  push:
    branches:
      - codex/hara-analyzer-benchmark
    paths:
      - .github/workflows/hara-analyzer-macos-benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: 1.12.218

      - name: Build the current HTA1 analyzer
        run: cargo build --release --manifest-path analyzers/hara/Cargo.toml

      - name: Run the exact-parity benchmark matrix
        run: |
          bun benchmarks/clojure-analyzer-matrix.js \
            --warmup 2 \
            --iterations 8 \
            --cold-runs 5 \
            --output-dir target/clojure-analyzer-benchmarks

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: hara-analyzer-scale-benchmark-macos
          path: target/clojure-analyzer-benchmarks
