name: Build release artifacts

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-release-artifacts.js"
      - "src/cli.js"
      - "src/historia-cli.js"
      - "src/collect/**"
      - "extension/**"
      - "analyzers/**"
      - "skills/**"
      - "spec/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build; must match package.json"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: historia-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_BUN_VERSION: 1.3.14

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.RELEASE_BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          package_version="$(bun -p "require('./package.json').version")"
          requested="${INPUT_VERSION#v}"
          if [ -n "$requested" ] && [ "$requested" != "$package_version" ]; then
            echo "Requested version $requested does not match package.json $package_version" >&2
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Tag $RELEASE_TAG does not match package.json v$package_version" >&2
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
      - name: Test embedded extension and installer
        run: bun test test/collect-extension-bundle.test.js test/collect-install.test.js
      - name: Cross-compile and verify release archives
        run: bun run release:build -- --version "${{ steps.release.outputs.version }}"
      - name: List release assets
        run: |
          ls -lh dist/release
          cat dist/release/SHA256SUMS
      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: historia-v${{ steps.release.outputs.version }}-release
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/release/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* \
              --verify-tag \
              --generate-notes \
              --title "Historia $RELEASE_TAG"
          fi
