name: Materialize Historia chat slice

on:
  push:
    branches:
      - agent/chat-retrieval-collect-app
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' && (github.head_ref == 'agent/chat-retrieval-collect-app' || github.ref == 'refs/heads/agent/chat-retrieval-collect-app') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/chat-retrieval-collect-app
      - name: Materialize source bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .historia-upload ]; then
            echo "No bundle to materialize."
            exit 0
          fi

          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path

          part_names = [
              ".historia-upload/p00-0",
              ".historia-upload/p00-1",
              ".historia-upload/p00-2",
              ".historia-upload/part-01",
              ".historia-upload/part-02",
              ".historia-upload/p03-0",
              ".historia-upload/p03-1",
              ".historia-upload/p03-2-0",
              ".historia-upload/p03-2-1",
              ".historia-upload/p03-2-2",
              ".historia-upload/p03-2-3",
              ".historia-upload/part-04",
              ".historia-upload/part-05",
              ".historia-upload/part-06",
              ".historia-upload/p07-0",
              ".historia-upload/p07-1",
          ]
          repair_name = ".historia-upload/p03-2-2"
          alphabet = b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          valid = set(alphabet + b"=")
          whitespace = set(b" \t\r\n")
          expected = "6ce9a2b2cfdfd05591158e595c8b49f4575d155f7e5dba594882f62ada0b4035"

          parts: list[bytes] = []
          for name in part_names:
              raw = Path(name).read_bytes()
              normalized = bytes(byte for byte in raw if byte not in whitespace)
              invalid = [(index, byte) for index, byte in enumerate(normalized) if byte not in valid]
              if invalid:
                  raise SystemExit(f"{name} contains non-base64 bytes: {invalid[:20]}")
              print(f"{name}: bytes={len(normalized)}")
              parts.append(normalized)

          joined = b"".join(parts)
          print(f"staged base64 bytes={len(joined)} mod4={len(joined) % 4}")

          def decode_and_digest(encoded: bytes) -> tuple[bytes, str] | None:
              try:
                  decoded = base64.b64decode(encoded, validate=True)
              except Exception:
                  return None
              return decoded, hashlib.sha256(decoded).hexdigest()

          result = decode_and_digest(joined)
          if result is not None and result[1] == expected:
              decoded = result[0]
              print("archive matched without repair")
          else:
              repair_index = part_names.index(repair_name)
              repair = parts[repair_index]
              prefix = b"".join(parts[:repair_index])
              suffix = b"".join(parts[repair_index + 1:])
              if len(joined) % 4 != 3:
                  raise SystemExit("archive is not a one-character-short base64 stream")

              decoded = None
              attempts = 0
              for offset in range(len(repair) + 1):
                  before = prefix + repair[:offset]
                  after = repair[offset:] + suffix
                  for character in alphabet:
                      attempts += 1
                      candidate = before + bytes((character,)) + after
                      candidate_result = decode_and_digest(candidate)
                      if candidate_result is not None and candidate_result[1] == expected:
                          decoded = candidate_result[0]
                          print(
                              f"recovered missing base64 character at {repair_name}:{offset}; "
                              f"character={chr(character)!r}; attempts={attempts}"
                          )
                          break
                  if decoded is not None:
                      break
                  if offset and offset % 100 == 0:
                      print(f"checked {offset} repair offsets")

              if decoded is None:
                  raise SystemExit(f"no one-character repair matched archive SHA-256 after {attempts} attempts")

          digest = hashlib.sha256(decoded).hexdigest()
          if digest != expected:
              raise SystemExit(f"archive digest mismatch: expected {expected}, found {digest}")
          print(f"decoded={len(decoded)} sha256={digest}")
          Path("/tmp/historia-next.tar.gz").write_bytes(decoded)
          PY

          tar -tzf /tmp/historia-next.tar.gz >/dev/null
          tar -xzf /tmp/historia-next.tar.gz -C .
          rm -rf .historia-upload
          rm -f .github/workflows/materialize-historia-chat-slice.yml

          git config user.name "Historia Build Bot"
          git config user.email "collect@historia.local"
          git add -A
          if git diff --cached --quiet; then
            echo "Bundle produced no changes."
            exit 0
          fi
          git commit -m "feat: add chat retrieval and collect app"
          git push origin HEAD:agent/chat-retrieval-collect-app
