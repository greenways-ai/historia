name: Bootstrap HAL analyzer rewrite

on:
  push:
    branches:
      - codex/hara-analyzer-benchmark

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hara-analyzer-benchmark
          fetch-depth: 0

      - name: Wait for the verified payload marker
        id: ready
        run: |
          if [ -f .bootstrap/ready ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the .hal analyzer source
        if: steps.ready.outputs.ready == 'true'
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/historia-hara-upload.tgz
          gzip -t /tmp/historia-hara-upload.tgz
          tar -xzf /tmp/historia-hara-upload.tgz -C .
          rm -f .github/workflows/hara-analyzer.yml
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rewrite the Historia analyzer in HAL"
          git push origin HEAD:codex/hara-analyzer-benchmark
